name: Release MarkView AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file \
            curl \
            librsvg2-bin \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install markdown pymdown-extensions pygments bleach pytest pygobject

      - name: Run automated test suite
        run: |
          PYTHONPATH=src pytest tests/ -v

      - name: Build Standalone Linux AppImage
        run: |
          chmod +x packaging/build-appimage.sh packaging/AppRun
          ./packaging/build-appimage.sh

      - name: Verify AppImage Artifact
        run: |
          ls -lh dist/MarkView-x86_64.AppImage
          sha256sum dist/MarkView-x86_64.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: MarkView ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/MarkView-x86_64.AppImage
